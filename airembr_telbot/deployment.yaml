apiVersion: apps/v1
kind: Deployment
metadata:
  name: airembr-telbot
  labels:
    app: airembr-telbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airembr-telbot
  template:
    metadata:
      labels:
        app: airembr-telbot
    spec:
      imagePullSecrets:
        - name: 'dockerhub'
      containers:
        - name: airembr-telbot
          image: tracardi/airembr-telbot:0.0.1
          imagePullPolicy: Always
          env:
          - name: LOGGING_LEVEL
            value: "debug"
          - name: TELEGRAM_BOT_TOKEN
            value: "8504464492:AAGQMBafsIEq8fAnERKgNarhxm8JvSRpPG4"
          - name: AIREMBR_SOURCE_ID
            value: "232fda49-cdbd-4c3d-bc22-a5a10393ce21"
          - name: AIREMBR_COLLECTOR_HOST
            value: "http://be-collector-api-svc.airembr.svc.cluster.local:4002"