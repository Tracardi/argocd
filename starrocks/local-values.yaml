starrocks:
  initPassword:
    enabled: true
    password: "3BoZGE68bC2D"
  starrocksBeSpec:
    replicas: 3
    image:
      repository: starrocks/be-ubuntu
      tag: 3.3-latest
    storageVolumes:
      name: starrocks-be-storage
      # storageVolumes: "local-path"
      # fe container stop running if the disk free space which the fe meta directory residents, is less than 5Gi.
      logStorageSize: 10Gi
      storageSize: 10Gi
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 1
        memory: 1Gi
    service:
      type: LoadBalancer  # Comment out to disable
  starrocksFESpec:
    replicas: 1
    image:
      repository: starrocks/fe-ubuntu
      tag: 3.3-latest
    storageVolumes:
      name: starrocks-fe-storage
      # storageVolumes: "local-path"
      # fe container stop running if the disk free space which the fe meta directory residents, is less than 5Gi.
      logStorageSize: 10Gi
      storageSize: 10Gi
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 1
        memory: 1Gi
    service:
      type: LoadBalancer  # Comment out to disable
  starrocksCnSpec:
    replicas: 0
    image:
      repository: starrocks/cn-ubuntu
      tag: 3.3-latest
    resources:
      requests:
        memory: 1Gi
        cpu: 1
  starrocksFeProxySpec:
    # specify the fe proxy deploy or not.
    enabled: false
    service:
      # the fe proxy service type, only supported ClusterIP, NodePort, LoadBalancer
      # default ClusterIP
      type: LoadBalancer
      # the loadBalancerIP for static ip config when the type=LoadBalancer and loadbalancerIp is not empty.
#       loadbalancerIP: "188.245.176.133"