apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-svc
  namespace: uptime-kuma
spec:
  selector:
    app: uptime-kuma
  ports:
  - name: uptime-kuma
    port: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-lb
  namespace: uptime-kuma
spec:
  type: LoadBalancer
  ports:
  - name: web-ui
    protocol: TCP
    port: 3001
    targetPort: 3001
  selector:
    app: uptime-kuma
