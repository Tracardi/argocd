{{ if and .Values.secrets.dockerHub .Values.worker.attachment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wk-attachment
  labels:
    app: wk-attachment
    version: {{ .Chart.AppVersion | quote }}
    {{- include "airembr.labels" (dict "ctx" . "component" "wk-attachment") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.attachment.replicas }}
  selector:
    matchLabels:
      {{- include "airembr.selectorLabels" (dict "ctx" . "component" "wk-attachment") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "airembr.podLabels" (dict "ctx" . "component" "wk-attachment") | nindent 8 }}
    spec:
      {{- include "chart.nodeAffinity" (dict "context" . "path" "worker.attachment") | nindent 6 }}

      {{ if .Values.worker.attachment.spread }}
        {{range .Values.worker.attachment.spread }}
          {{ toYaml . | nindent 6 }}
        {{ end }}
      {{ end }}

      imagePullSecrets:
        - name: {{ .Values.secrets.dockerHub | quote }}
      initContainers:
        - name: init
          image: {{ .Values.worker.attachment.image.init }}:{{ .Values.worker.attachment.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            {{- include "airembr.env" (dict "ctx" .) | nindent 12 }}
            - name: LOGGING_LEVEL
              value: debug
      containers:
        - name: wk-attachment
          image: "{{ .Values.worker.attachment.image.repository }}:{{ .Values.worker.attachment.image.tag }}"
          imagePullPolicy: {{ .Values.worker.attachment.image.pullPolicy }}
          resources:
            limits:
              memory: {{ .Values.worker.attachment.resources.limits.memory }}
              cpu: {{ .Values.worker.attachment.resources.limits.cpu }}
            requests:
              memory: {{ .Values.worker.attachment.resources.requests.memory }}
              cpu: {{ .Values.worker.attachment.resources.requests.cpu }}
          env:
            {{- include "airembr.env" (dict "ctx" .) | nindent 12 }}
            - name: LOGGING_LEVEL
              value: {{ .Values.worker.attachment.config.loggingLevel | quote }}
            - name: INACTIVITY_TIME_OUT
              value: {{ .Values.worker.attachment.config.bulker.bufferInactivityTimeOut | quote }}
            - name: CONSUMER_TYPE
              value: "system.event.attachments"

          volumeMounts:
            - name: pre-resources-vol
              mountPath: "/system/system/db/preconfig/data/resources.json"
              subPath: "resources.json"
            - name: pre-destinations-vol
              mountPath: "/system/system/db/preconfig/data/destinations.json"
              subPath: "destinations.json"
            - name: pre-event-sources-vol
              mountPath: "/system/system/db/preconfig/data/event-sources.json"
              subPath: "event-sources.json"
            - name: tenant-aliases-vol
              mountPath: "/system/system/db/preconfig/data/tenant-aliases.json"
              subPath: "tenant-aliases.json"

      volumes:
        - name: pre-resources-vol
          configMap:
            name: pre-resources-cm

        - name: pre-destinations-vol
          configMap:
            name: pre-destinations-cm

        - name: pre-event-sources-vol
          configMap:
            name: pre-event-sources-cm

        - name: tenant-aliases-vol
          configMap:
            name: tenant-aliases-cm
{{ end }}