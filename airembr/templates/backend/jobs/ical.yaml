{{ if and .Values.secrets.dockerHub .Values.job.ical.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-ical
  labels:
    app: job-ical
    version: {{ .Chart.AppVersion | quote }}
    {{- include "airembr.labels" (dict "ctx" . "component" "job-ical") | nindent 4 }}
spec:
  schedule: "*/15 * * * *" # every 15 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "airembr.podLabels" (dict "ctx" . "component" "job-ical") | nindent 12 }}
        spec:
          {{- include "chart.nodeAffinity" (dict "context" . "path" "job.ical") | nindent 10 }}
          {{ if .Values.job.ical.spread }}
            {{range .Values.job.ical.spread }}
              {{ toYaml . | nindent 10 }}
            {{ end }}
          {{ end }}
          imagePullSecrets:
            - name: {{ .Values.secrets.dockerHub | quote }}
          restartPolicy: OnFailure
          containers:
            - name: job-ical
              image: "{{ .Values.job.ical.image.repository }}:{{ .Values.job.ical.image.tag }}"
              imagePullPolicy: {{ .Values.job.ical.image.pullPolicy }}
              resources:
                limits:
                  memory: {{ .Values.job.ical.resources.limits.memory }}
                  cpu: {{ .Values.job.ical.resources.limits.cpu }}
                requests:
                  memory: {{ .Values.job.ical.resources.requests.memory }}
                  cpu: {{ .Values.job.ical.resources.requests.cpu }}
              env:
                {{- include "airembr.env" (dict "ctx" .) | nindent 16 }}
                - name: LOGGING_LEVEL
                  value: {{ .Values.job.ical.config.loggingLevel | quote }}
{{ end }}
