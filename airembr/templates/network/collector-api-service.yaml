{{ if .Values.api.collector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: be-collector-api-svc
spec:
  type: ClusterIP
  selector:
    {{- include "airembr.selectorLabels" (dict "ctx" . "component" "be-collector-api") | nindent 6 }}
  ports:
    - protocol: TCP
      port: {{ .Values.api.collector.service.port }}
      targetPort: collector-port

{{ if .Values.api.collector.service.loadBalancer }}
---
apiVersion: v1
kind: Service
metadata:
  name: be-collector-api-lb
spec:
  type: LoadBalancer
  selector:
    {{- include "tracardi.selectorLabels" (dict "ctx" . "component" "be-collector-api") | nindent 6 }}
  ports:
    - name: http-{{ .Values.api.collector.service.port }}
      protocol: TCP
      port: {{ .Values.api.collector.service.port }}
      targetPort: collector-port
{{ end }}
{{ end }}