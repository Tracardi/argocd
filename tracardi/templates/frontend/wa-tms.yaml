{{ if and .Values.tmsGui.docker.enabled .Values.tms.docker.enabled (eq .Values.config.multiTenant.multi "no") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wa-tms
  labels:
    {{- include "tracardi.labels" (dict "ctx" . "component" "wa-tms") | nindent 4 }}
spec:
  replicas: {{ .Values.tmsGui.docker.replicas }}
  selector:
    matchLabels:
      {{- include "tracardi.selectorLabels" (dict "ctx" . "component" "wa-tms") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tracardi.podLabels" (dict "ctx" . "component" "wa-tms") | nindent 8 }}
    spec:
      {{- include "chart.nodeAffinity" (dict "context" . "path" "tmsGui") | nindent 6 }}
      imagePullSecrets:
        - name: {{ .Values.secrets.dockerHub | quote }}
      containers:
        - name: wa-tms
          {{- include "tracardi.image" (dict "ctx" . "repo" .Values.tmsGui.image.repository "tag" .Values.tmsGui.image.tag "policy" .Values.tmsGui.image.pullPolicy) | nindent 10 }}
          resources:
            limits:
              memory: 50Mi
              cpu: 500m
            requests:
              memory: 20Mi
              cpu: 300m
          ports:
            - containerPort: 80
              name: tms-gui-port

{{ end }}