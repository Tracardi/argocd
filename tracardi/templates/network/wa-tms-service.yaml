{{ if and .Values.tmsGui.docker.enabled .Values.tms.docker.enabled (eq .Values.config.multiTenant.multi "no") }}
apiVersion: v1
kind: Service
metadata:
  name: wa-tms-svc
spec:
  type: ClusterIP
  selector:
    {{- include "tracardi.selectorLabels" (dict "ctx" . "component" "wa-tms") | nindent 6 }}
  ports:
    - protocol: TCP
      port: {{ .Values.tmsGui.docker.service.port }}
      targetPort: tms-gui-port


{{ if and .Values.tmsGui.docker.service.loadBalancer }}
---
apiVersion: v1
kind: Service
metadata:
  name: wa-tms-lb
spec:
  type: LoadBalancer
  selector:
    {{- include "tracardi.selectorLabels" (dict "ctx" . "component" "wa-tms") | nindent 6 }}
  ports:
    - name: http-{{ .Values.tmsGui.docker.service.port }}
      protocol: TCP
      port: {{ .Values.tmsGui.docker.service.port }}
      targetPort: tms-gui-port
{{ end }}
{{ end }}