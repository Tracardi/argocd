{{ if .Values.api.collector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: api-collector-svc
spec:
  type: ClusterIP
  selector:
    {{- include "tracardi.selectorLabels" (dict "ctx" . "component" "api-collector") | nindent 6 }}
  ports:
    - protocol: TCP
      port: {{ .Values.api.collector.service.port }}
      targetPort: api-col-port

{{ if .Values.api.collector.service.loadBalancer }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-collector-lb
spec:
  type: LoadBalancer
  selector:
    {{- include "tracardi.selectorLabels" (dict "ctx" . "component" "api-collector") | nindent 6 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.api.collector.service.port }}
      targetPort: api-col-port
{{ end }}
{{ end }}