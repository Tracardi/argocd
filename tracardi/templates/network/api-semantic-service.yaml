{{ if .Values.api.semantic.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: api-semantic-svc
spec:
  type: ClusterIP
  selector:
    {{- include "tracardi.selectorLabels" (dict "ctx" . "component" "api-semantic") | nindent 6 }}
  ports:
    - protocol: TCP
      port: {{ .Values.api.semantic.service.port }}
      targetPort: api-sem-port

{{ if .Values.api.semantic.service.loadBalancer }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-semantic-lb
spec:
  type: LoadBalancer
  selector:
    {{- include "tracardi.selectorLabels" (dict "ctx" . "component" "api-semantic") | nindent 6 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.api.semantic.service.port }}
      targetPort: api-sem-port
{{ end }}
{{ end }}