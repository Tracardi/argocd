{{ if and .Values.secrets.dockerHub .Values.api.collector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-collector
  labels:
    {{- include "tracardi.labels" (dict "ctx" . "component" "api-collector") | nindent 4 }}
spec:
  replicas: {{ .Values.api.collector.replicas }}
  selector:
    matchLabels:
      {{- include "tracardi.selectorLabels" (dict "ctx" . "component" "api-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tracardi.podLabels" (dict "ctx" . "component" "api-collector") | nindent 8 }}
    spec:
      {{- include "chart.nodeAffinity" (dict "context" . "path" "api.public") | nindent 6 }}
      {{ if .Values.api.collector.spread }}
        {{range .Values.api.collector.spread }}
          {{ toYaml . | nindent 6 }}
        {{ end }}
      {{ end }}
      imagePullSecrets:
        - name: {{ .Values.secrets.dockerHub | quote }}
      initContainers:
        - name: tracardi-init
          image: tracardi/init:{{ .Values.api.collector.image.tag }}
          imagePullPolicy: Always
          env:
            {{- include "tracardi.env" (dict "ctx" .) | nindent 12 }}
            - name: LOGGING_LEVEL
              value: debug
      containers:
        - name: api-collector
          {{- include "tracardi.image" (dict "ctx" . "repo" .Values.api.collector.image.repository "tag" .Values.api.collector.image.tag "policy" .Values.api.collector.image.pullPolicy) | nindent 10 }}
          resources:
            limits:
              memory: {{ .Values.api.collector.resources.limits.memory }}
              cpu: {{ .Values.api.collector.resources.limits.cpu }}
            requests:
              memory: {{ .Values.api.collector.resources.requests.memory }}
              cpu: {{ .Values.api.collector.resources.requests.cpu }}
          ports:
            - name: api-col-port
              containerPort: 80
          {{- include "tracardi.livenessProbe" . | nindent 10 }}
          env:
            {{- include "tracardi.env" (dict "ctx" .) | nindent 12 }}
            - name: EXPOSE_GUI_API
              value: {{ .Values.api.collector.config.enableGuiApi | quote }}
            - name: PRODUCTION
              value: "yes"
            - name: LOGGING_LEVEL
              value: {{ .Values.api.collector.config.loggingLevel | quote }}
            - name: SAVE_LOGS
              value: {{ .Values.api.collector.config.saveLogs | quote }}
            - name: SERVER_LOGGING_LEVEL
              value: {{ .Values.api.collector.config.serverLoggingLevel | quote }}

          volumeMounts:
            {{- include "tracardi.volumeMounts" (dict "ctx" .) | nindent 12 }}
      volumes:
        {{- include "tracardi.volumes" (dict "ctx" .) | nindent 8 }}

{{ end }}