apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      kafka-0:
        port: 9092
        expose:
          default: true
        exposedPort: 9092
        protocol: TCP
      kafka-1:
        port: 9093
        expose:
          default: true
        exposedPort: 9093
        protocol: TCP
      kafka-2:
        port: 9094
        expose:
          default: true
        exposedPort: 9094
        protocol: TCP